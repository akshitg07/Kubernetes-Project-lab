services:
  task-manager-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-manager-api:local
    container_name: task-manager-api
    environment:
      TASK_MANAGER_ENVIRONMENT: local-container
      TASK_MANAGER_LOG_LEVEL: INFO
      TASK_MANAGER_DATABASE_URL: sqlite:////data/task_manager.db
    ports:
      - "8000:8000"
    volumes:
      - task-manager-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  task-manager-data:
